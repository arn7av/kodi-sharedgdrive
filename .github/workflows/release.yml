name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: plugin.video.sharedgdrive
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pycryptodome

      - name: Run unit tests
        run: python -m unittest discover -s plugin.video.sharedgdrive/tests -v

      - name: Validate tag and determine artifact paths
        id: metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git -C plugin.video.sharedgdrive merge-base --is-ancestor "$COMMIT_SHA" origin/main || {
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          }
          python - <<'PY'
          import os
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          tag = os.environ["TAG_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if not match:
              raise SystemExit(f"Release tag must be v<major>.<minor>.<patch>; got {tag!r}")

          version = ET.parse("plugin.video.sharedgdrive/addon.xml").getroot().attrib["version"]
          if match.group(1) != version:
              raise SystemExit(f"Tag {tag} does not match addon.xml version {version}")

          repository_version = ET.parse(
              "plugin.video.sharedgdrive/repository.sharedgdrive/addon.xml"
          ).getroot().attrib["version"]
          archive = pathlib.Path(f"plugin.video.sharedgdrive-{version}.zip")
          repository_archive = pathlib.Path(
              "kodi-repository-site/repository.sharedgdrive/"
              f"repository.sharedgdrive-{repository_version}.zip"
          )
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as destination:
              destination.write(f"version={version}\n")
              destination.write(f"archive={archive}\n")
              destination.write(f"repository_version={repository_version}\n")
              destination.write(f"repository_archive={repository_archive}\n")
          PY

      - name: Download prior release archives
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import email.utils
          import json
          import os
          import pathlib
          import re
          import time
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          current_version = tuple(int(part) for part in os.environ["VERSION"].split("."))
          destination = pathlib.Path("historical-archives")
          destination.mkdir()
          patterns = (
              re.compile(r"plugin\.video\.sharedgdrive-(\d+\.\d+\.\d+)\.zip"),
              re.compile(r"repository\.sharedgdrive-(\d+\.\d+\.\d+)\.zip"),
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          max_attempts = 4
          max_retry_delay = 60.0
          retryable_statuses = {429, 500, 502, 503, 504}

          def retry_delay(response_headers, attempt):
              suggested_delay = 0.0
              retry_after = response_headers.get("Retry-After")
              if retry_after:
                  try:
                      suggested_delay = float(retry_after)
                  except ValueError:
                      try:
                          retry_at = email.utils.parsedate_to_datetime(retry_after).timestamp()
                      except (TypeError, ValueError):
                          pass
                      else:
                          suggested_delay = max(0.0, retry_at - time.time())
              if response_headers.get("X-RateLimit-Remaining") == "0":
                  try:
                      reset_delay = float(response_headers["X-RateLimit-Reset"]) - time.time() + 1
                  except (KeyError, TypeError, ValueError):
                      pass
                  else:
                      suggested_delay = max(suggested_delay, reset_delay)
              exponential_delay = 2 ** (attempt - 1)
              return min(max_retry_delay, max(exponential_delay, suggested_delay))

          def read_url(request, timeout):
              for attempt in range(1, max_attempts + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return response.read()
                  except urllib.error.HTTPError as error:
                      response_headers = error.headers or {}
                      rate_limited = error.code == 403 and (
                          response_headers.get("Retry-After")
                          or response_headers.get("X-RateLimit-Remaining") == "0"
                      )
                      if (
                          attempt == max_attempts
                          or (error.code not in retryable_statuses and not rate_limited)
                      ):
                          raise
                      delay = retry_delay(response_headers, attempt)
                      error.close()
                      reason = f"HTTP {error.code}"
                  except (TimeoutError, urllib.error.URLError) as error:
                      if attempt == max_attempts:
                          raise
                      delay = retry_delay({}, attempt)
                      reason = str(error.reason) if isinstance(error, urllib.error.URLError) else str(error)
                  print(
                      f"::warning::GitHub request failed ({reason}); retrying in {delay:.1f}s "
                      f"(attempt {attempt + 1}/{max_attempts})"
                  )
                  time.sleep(delay)
              raise AssertionError("unreachable")

          page = 1
          while True:
              url = f"https://api.github.com/repos/{repository}/releases?per_page=100&page={page}"
              releases = json.loads(
                  read_url(urllib.request.Request(url, headers=headers), timeout=30)
              )
              if not releases:
                  break
              for release in releases:
                  if release.get("draft") or release.get("prerelease"):
                      continue
                  tag_match = re.fullmatch(r"v(\d+\.\d+\.\d+)", release.get("tag_name", ""))
                  if tag_match:
                      released_version = tuple(int(part) for part in tag_match.group(1).split("."))
                      if released_version > current_version:
                          raise SystemExit(
                              f"Refusing to publish {os.environ['VERSION']} after newer release "
                              f"{tag_match.group(1)}"
                          )
                  for asset in release.get("assets", ()):
                      name = asset.get("name", "")
                      if not any(pattern.fullmatch(name) for pattern in patterns):
                          continue
                      target = destination / name
                      request_headers = dict(headers)
                      request_headers["Accept"] = "application/octet-stream"
                      request = urllib.request.Request(asset["url"], headers=request_headers)
                      content = read_url(request, timeout=60)
                      if target.exists() and target.read_bytes() != content:
                          raise SystemExit(f"Conflicting published release asset: {name}")
                      target.write_bytes(content)
              page += 1
          PY

      - name: Build add-on package
        run: python plugin.video.sharedgdrive/package.py

      - name: Build Kodi repository site
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          python plugin.video.sharedgdrive/build_repository.py \
            --addon-archive "$ARCHIVE" \
            --historical-directory historical-archives \
            --output kodi-repository-site

      - name: Assemble and verify release assets
        env:
          ADDON_ARCHIVE: ${{ steps.metadata.outputs.archive }}
          REPOSITORY_ARCHIVE: ${{ steps.metadata.outputs.repository_archive }}
        run: |
          python -m zipfile -t "$ADDON_ARCHIVE"
          python -m zipfile -t "$REPOSITORY_ARCHIVE"
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import shutil

          output = pathlib.Path("release-assets")
          output.mkdir()
          for variable in ("ADDON_ARCHIVE", "REPOSITORY_ARCHIVE"):
              source = pathlib.Path(os.environ[variable])
              destination = output / source.name
              shutil.copyfile(source, destination)
              digest = hashlib.sha256(destination.read_bytes()).hexdigest()
              (output / f"{destination.name}.sha256").write_text(
                  f"{digest}  {destination.name}\n",
                  encoding="ascii",
              )
          PY

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*.zip

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kodi-repository-site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    environment:
      name: kodi-repository
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: deploy-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
