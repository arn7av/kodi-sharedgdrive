name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: plugin.video.sharedgdrive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pycryptodome

      - name: Run unit tests
        run: python -m unittest discover -s plugin.video.sharedgdrive/tests -v

      - name: Validate Python and XML
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path("plugin.video.sharedgdrive")
          for path in root.rglob("*.py"):
              compile(ast.parse(path.read_text(encoding="utf-8")), str(path), "exec")
          ET.parse(root / "addon.xml")
          ET.parse(root / "resources/settings.xml")
          PY

      - name: Build and test package
        run: |
          python plugin.video.sharedgdrive/package.py
          VERSION=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('plugin.video.sharedgdrive/addon.xml').getroot().attrib['version'])")
          python -m zipfile -t "plugin.video.sharedgdrive-${VERSION}.zip"
